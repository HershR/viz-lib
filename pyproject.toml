[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizlib"
version = "0.1.0"
description = "An opinionated matplotlib wrapper that turns a pandas DataFrame into a publication-ready chart in one call."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hersh" }]
keywords = ["matplotlib", "pandas", "visualization", "charts", "dataviz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mpl>=0.16",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vizlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
