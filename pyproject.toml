[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chartcn"
version = "0.1.0"
description = "A shadcn-inspired chart library: an opinionated matplotlib wrapper that turns a pandas DataFrame into a clean shadcn-style chart in one call, light and dark."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hersh" }]
keywords = ["matplotlib", "pandas", "visualization", "charts", "dataviz", "shadcn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/HershR/viz-lib"
Repository = "https://github.com/HershR/viz-lib"
Issues = "https://github.com/HershR/viz-lib/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mpl>=0.16",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chartcn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.black]
target-version = ["py310"]
